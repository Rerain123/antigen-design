---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: antigen-af3-databases-extract-r01
  namespace: him-ws
spec:
  podSelector:
    matchLabels:
      app: antigen-af3-databases-extract-r01
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: batch/v1
kind: Job
metadata:
  name: antigen-af3-databases-extract-r01
  namespace: him-ws
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        app: antigen-af3-databases-extract-r01
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: extract
        image: harbor-core.base.svc.cluster.local/qcyz/antigen-design@sha256:fba5a32c0550e56a5310160e2fc49d647fcd27d76851073a2d82cc935fb4c2fc
        command:
        - python
        - -u
        - -B
        - /extract/extract_af3_databases.py
        - /databases/alphafold3-v3.0/archives
        - /databases/alphafold3-v3.0/unpacked
        - /extract/database-manifest.json
        - --run-id
        - r01
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: databases
          mountPath: /databases
        - name: extract
          mountPath: /extract
          readOnly: true
      volumes:
      - name: databases
        persistentVolumeClaim:
          claimName: antigen-af3-databases
      - name: extract
        configMap:
          name: antigen-af3-databases-extract-r01
