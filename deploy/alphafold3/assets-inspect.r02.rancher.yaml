apiVersion: v1
kind: ConfigMap
metadata:
  name: antigen-af3-assets-inspect-r02
  namespace: him-ws
immutable: true
data:
  inspect_af3_assets.py: "\"\"\"Read-only AF3 archive/receipt and PVC-space inspection.\n\
    \nThis deliberately does not decompress or hash the 238 GB database payloads.\n\
    The downloader already recorded full-stream MD5/SHA-256 verification; this\nstep\
    \ independently remounts both PVCs, checks identities/sizes/receipts and\nreports\
    \ actual filesystem capacity before an extraction job is prepared.\n\"\"\"\nfrom\
    \ __future__ import annotations\n\nimport argparse\nimport json\nimport os\nfrom\
    \ pathlib import Path\nimport re\nimport stat\n\n\nWEIGHT_FILE = \"af3.bin.zst\"\
    \nWEIGHT_BYTES = 1_020_545_840\nWEIGHT_SHA256 = \"74d0258616917cd122f5eab6d076afe4a8930e96823851e65e4f777dfb1f33ff\"\
    \nOFFICIAL_EXPANDED_ESTIMATE_BYTES = 630_000_000_000\nPLANNING_RESERVE_BYTES =\
    \ 64 * 1024**3\n\n\ndef read_json(path: Path) -> dict:\n    return json.loads(path.read_bytes())\n\
    \n\ndef regular_file(path: Path, size: int | None = None) -> None:\n    info =\
    \ path.lstat()\n    if not stat.S_ISREG(info.st_mode) or path.is_symlink():\n\
    \        raise ValueError(f\"Expected regular file: {path.name}\")\n    if size\
    \ is not None and info.st_size != size:\n        raise ValueError(f\"Unexpected\
    \ size: {path.name}\")\n\n\ndef filesystem(path: Path) -> dict:\n    value = os.statvfs(path)\n\
    \    return {\n        \"total_bytes\": value.f_blocks * value.f_frsize,\n   \
    \     \"free_bytes\": value.f_bavail * value.f_frsize,\n        \"used_bytes\"\
    : (value.f_blocks - value.f_bfree) * value.f_frsize,\n    }\n\n\ndef inspect(databases:\
    \ Path, weights: Path, manifest_path: Path) -> dict:\n    databases, weights =\
    \ databases.resolve(), weights.resolve()\n    manifest = read_json(manifest_path)\n\
    \    if manifest[\"schema\"] != \"t01.af3-database-download/1\" or manifest[\"\
    archives_only\"] is not True:\n        raise ValueError(\"Unexpected pinned database\
    \ manifest\")\n    if read_json(databases / \"database-manifest.json\") != manifest:\n\
    \        raise ValueError(\"PVC database manifest differs from the pinned manifest\"\
    )\n    receipt = read_json(databases / \"download-receipt.json\")\n    if receipt.get(\"\
    status\") != \"DATABASE_ARCHIVES_VERIFIED_NOT_DEPLOYED\":\n        raise ValueError(\"\
    Database download receipt is not verified\")\n    if receipt.get(\"decompressed\"\
    ) is not False or receipt.get(\"scientific_gate\") != \"CLOSED\":\n        raise\
    \ ValueError(\"Database receipt release guards differ\")\n    receipt_assets =\
    \ {row[\"file\"]: row for row in receipt[\"assets\"]}\n    expected_names = {row[\"\
    file\"] for row in manifest[\"assets\"]}\n    if set(receipt_assets) != expected_names:\n\
    \        raise ValueError(\"Database receipt inventory differs from the pinned\
    \ manifest\")\n    rows = []\n    for asset in manifest[\"assets\"]:\n       \
    \ name, identity = asset[\"file\"], asset[\"identity\"]\n        if Path(name).name\
    \ != name or \"/\" in name or \"\\\\\" in name:\n            raise ValueError(\"\
    Unsafe archive name\")\n        archive = databases / name\n        regular_file(archive,\
    \ identity[\"bytes\"])\n        if (databases / f\"{name}.partial\").exists():\n\
    \            raise ValueError(f\"Partial archive remains: {name}\")\n        if\
    \ read_json(databases / f\"{name}.source.json\") != identity:\n            raise\
    \ ValueError(f\"Source identity differs: {name}\")\n        per_file = read_json(databases\
    \ / f\"{name}.receipt.json\")\n        if per_file != receipt_assets[name]:\n\
    \            raise ValueError(f\"Per-file receipt differs: {name}\")\n       \
    \ if any(per_file.get(key) != value for key, value in identity.items()):\n   \
    \         raise ValueError(f\"Pinned identity differs in receipt: {name}\")\n\
    \        if (per_file.get(\"status\"), per_file.get(\"official_md5_verified\"\
    ),\n                per_file.get(\"decompressed\"), per_file.get(\"scientific_gate\"\
    )) != (\n                \"ARCHIVE_VERIFIED_NOT_DEPLOYED\", True, False, \"CLOSED\"\
    ):\n            raise ValueError(f\"Archive verification guard differs: {name}\"\
    )\n        if not re.fullmatch(r\"[0-9a-f]{64}\", per_file.get(\"sha256\", \"\"\
    )):\n            raise ValueError(f\"Missing archive SHA-256: {name}\")\n    \
    \    rows.append({\"file\": name, \"bytes\": archive.stat().st_size, \"sha256\"\
    : per_file[\"sha256\"]})\n    if sum(row[\"bytes\"] for row in rows) != manifest[\"\
    total_bytes\"]:\n        raise ValueError(\"Database archive byte total differs\"\
    )\n\n    weight_receipt = read_json(weights / \"download-receipt.json\")\n   \
    \ regular_file(weights / WEIGHT_FILE, WEIGHT_BYTES)\n    if (weights / f\"{WEIGHT_FILE}.partial\"\
    ).exists():\n        raise ValueError(\"Partial weight archive remains\")\n  \
    \  if (weight_receipt.get(\"file\"), weight_receipt.get(\"bytes\"), weight_receipt.get(\"\
    sha256\")) != (\n            WEIGHT_FILE, WEIGHT_BYTES, WEIGHT_SHA256):\n    \
    \    raise ValueError(\"Weight receipt identity differs\")\n    if (weight_receipt.get(\"\
    status\"), weight_receipt.get(\"official_crc32c_verified\"),\n            weight_receipt.get(\"\
    decompressed\"), weight_receipt.get(\"scientific_gate\")) != (\n            \"\
    WEIGHTS_DOWNLOADED_VERIFIED_NOT_DEPLOYED\", True, False, \"CLOSED\"):\n      \
    \  raise ValueError(\"Weight verification guard differs\")\n\n    database_fs\
    \ = filesystem(databases)\n    weights_fs = filesystem(weights)\n    planning_need\
    \ = OFFICIAL_EXPANDED_ESTIMATE_BYTES + PLANNING_RESERVE_BYTES\n    return {\n\
    \        \"status\": \"AF3_ASSETS_MOUNTED_RECEIPTS_AND_SIZES_VERIFIED_NOT_EXTRACTED\"\
    ,\n        \"database_archives\": {\"count\": len(rows), \"bytes\": sum(row[\"\
    bytes\"] for row in rows), \"files\": rows},\n        \"database_filesystem\"\
    : database_fs,\n        \"extraction_space_planning\": {\n            \"official_approximate_expanded_bytes\"\
    : OFFICIAL_EXPANDED_ESTIMATE_BYTES,\n            \"reserve_bytes\": PLANNING_RESERVE_BYTES,\n\
    \            \"required_planning_free_bytes\": planning_need,\n            \"\
    provisionally_sufficient\": database_fs[\"free_bytes\"] >= planning_need,\n  \
    \          \"note\": \"Planning check only; exact expanded size must be measured\
    \ and bounded by the extraction job.\",\n        },\n        \"weights\": {\"\
    file\": WEIGHT_FILE, \"bytes\": WEIGHT_BYTES, \"sha256\": WEIGHT_SHA256},\n  \
    \      \"weights_filesystem\": weights_fs,\n        \"scientific_gate\": \"CLOSED\"\
    ,\n        \"usable_for_pipeline\": False,\n        \"production_status\": \"\
    NOT_DEPLOYED\",\n    }\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser(description=__doc__)\n\
    \    parser.add_argument(\"databases\", type=Path)\n    parser.add_argument(\"\
    weights\", type=Path)\n    parser.add_argument(\"manifest\", type=Path)\n    args\
    \ = parser.parse_args()\n    result = inspect(args.databases, args.weights, args.manifest)\n\
    \    print(\"AF3_ASSET_INSPECTION \" + json.dumps(result, ensure_ascii=False,\
    \ sort_keys=True), flush=True)\n\n\nif __name__ == \"__main__\":\n    main()\n"
