---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: antigen-af3-assets-inspect-r02
  namespace: him-ws
spec:
  podSelector:
    matchLabels:
      app: antigen-af3-assets-inspect-r02
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: batch/v1
kind: Job
metadata:
  name: antigen-af3-assets-inspect-r02
  namespace: him-ws
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: antigen-af3-assets-inspect-r02
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: inspect
        image: harbor-core.base.svc.cluster.local/qcyz/antigen-design@sha256:fba5a32c0550e56a5310160e2fc49d647fcd27d76851073a2d82cc935fb4c2fc
        command:
        - python
        - -u
        - -B
        - /inspect/inspect_af3_assets.py
        - /databases/alphafold3-v3.0/archives
        - /weights/alphafold3-official-r01
        - /inspect/database-manifest.json
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
            ephemeral-storage: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: databases
          mountPath: /databases
          readOnly: true
        - name: models
          mountPath: /weights
          readOnly: true
        - name: inspect
          mountPath: /inspect
          readOnly: true
      volumes:
      - name: databases
        persistentVolumeClaim:
          claimName: antigen-af3-databases
          readOnly: true
      - name: models
        persistentVolumeClaim:
          claimName: antigen-af3-models
          readOnly: true
      - name: inspect
        configMap:
          name: antigen-af3-assets-inspect-r02
