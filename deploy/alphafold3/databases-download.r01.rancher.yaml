apiVersion: batch/v1
kind: Job
metadata:
  name: antigen-af3-databases-download-r01
  namespace: him-ws
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 604800
  template:
    metadata:
      labels:
        app: antigen-af3-databases-download-r01
      annotations:
        antigen-design/download-bundle-sha256: 4a2ea8938eed2e4f5ca7508337d51120f5d8b6ae77e751e9b383450e6f5a706e
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: harbor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: download
        image: harbor-core.base.svc.cluster.local/qcyz/antigen-design@sha256:fba5a32c0550e56a5310160e2fc49d647fcd27d76851073a2d82cc935fb4c2fc
        command:
        - python
        - -u
        - -B
        - /download/download_af3_databases.py
        - /databases/alphafold3-v3.0/archives
        - /download/database-manifest.json
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
            ephemeral-storage: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: databases
          mountPath: /databases
        - name: script
          mountPath: /download
          readOnly: true
      volumes:
      - name: databases
        persistentVolumeClaim:
          claimName: antigen-af3-databases
      - name: script
        configMap:
          name: antigen-af3-databases-download-r01
