apiVersion: v1
kind: Pod
metadata:
  name: antigen-af3-registry-network-probe-r01
  namespace: him-ws
  labels:
    app: antigen-af3-registry-network-probe-r01
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  containers:
  - name: probe
    image: moby/buildkit@sha256:995077ff90af1afff56ff23018699d7511d122b2b111041f2011bd12afd5c0fe
    command:
    - /bin/sh
    - -ec
    - |
      target=http://harbor-core.base.svc.cluster.local/v2/
      check() {
        label="$1"
        shift
        set +e
        output="$(timeout 20 "$@" wget -S -O /dev/null "$target" 2>&1)"
        rc=$?
        set -e
        printf '%s\n' "$output" | sed -n '1,12p'
        if printf '%s\n' "$output" | grep -q 'HTTP/1.1 401'; then
          echo "AF3_REGISTRY_NETWORK_REACHABLE $label"
          return 0
        fi
        echo "AF3_REGISTRY_NETWORK_UNREACHABLE $label rc=$rc"
        return 0
      }
      check default-rootless rootlesskit
      check host-rootless rootlesskit --net=host
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: true
      seccompProfile:
        type: Unconfined
      appArmorProfile:
        type: Unconfined
      capabilities:
        drop:
        - ALL
        add:
        - SETUID
        - SETGID
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: antigen-af3-registry-network-probe-r01
  namespace: him-ws
spec:
  podSelector:
    matchLabels:
      app: antigen-af3-registry-network-probe-r01
  policyTypes:
  - Ingress
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 80
