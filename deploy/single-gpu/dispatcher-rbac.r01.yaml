apiVersion: v1
kind: ServiceAccount
metadata:
  name: antigen-gpu-dispatcher
  namespace: him-ws
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: antigen-gpu-dispatcher
  namespace: him-ws
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [antigen-design-gpu-slot]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: antigen-gpu-dispatcher
  namespace: him-ws
subjects:
  - kind: ServiceAccount
    name: antigen-gpu-dispatcher
    namespace: him-ws
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: antigen-gpu-dispatcher
