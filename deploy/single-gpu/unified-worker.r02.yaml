apiVersion: v1
kind: ConfigMap
metadata:
  name: antigen-unified-gpu-code-r02
  namespace: him-ws
immutable: true
data:
  unified_gpu_worker.py: "\"\"\"One permanently allocated GPU, one serial process\
    \ owner, no cluster API.\n\nScientific commands remain isolated executables. A\
    \ durable cross-spool intent\nprevents an uncertain execution in one environment\
    \ being bypassed by another.\n\"\"\"\nfrom __future__ import annotations\n\nimport\
    \ argparse\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib\
    \ import Path\nimport re\nimport signal\nimport subprocess\nimport time\n\nfrom\
    \ .resident_process import atomic, run\nfrom .resident_worker import commands_from_file\n\
    \nTERMINAL = {'succeeded', 'failed', 'cancelled', 'timed_out', 'interrupted'}\n\
    \n\ndef read_json(path):\n    if path.is_symlink() or path.stat().st_size > 1024\
    \ ** 2:\n        raise ValueError('Unsafe worker record')\n    raw = path.read_bytes()\n\
    \    return json.loads(raw), hashlib.sha256(raw).hexdigest()\n\n\ndef configured(path):\n\
    \    config, _ = read_json(Path(path))\n    if set(config) != {'version', 'uuid',\
    \ 'state_root', 'spools'} or config['version'] != '0.1.0':\n        raise ValueError('Expected\
    \ unified GPU worker configuration v0.1.0')\n    if not re.fullmatch(r'GPU-[0-9a-f-]{36}',\
    \ config['uuid']):\n        raise ValueError('Exact physical GPU UUID required')\n\
    \    state_root = Path(config['state_root'])\n    if not state_root.is_absolute()\
    \ or state_root.is_symlink():\n        raise ValueError('Absolute non-symlink\
    \ state directory required')\n    spools = {}\n    all_tools = set()\n    for\
    \ row in config['spools']:\n        if set(row) != {'root', 'config'}:\n     \
    \       raise ValueError('Unexpected spool fields')\n        root, registry =\
    \ Path(row['root']), Path(row['config'])\n        if not root.is_absolute() or\
    \ root.is_symlink() or not registry.is_absolute() or registry.is_symlink():\n\
    \            raise ValueError('Unsafe operator spool/config path')\n        commands\
    \ = commands_from_file(registry)\n        if root in spools or all_tools.intersection(commands):\n\
    \            raise ValueError('Duplicate spool/tool registration')\n        spools[root]\
    \ = commands\n        all_tools.update(commands)\n    if not spools or len(spools)\
    \ > 8:\n        raise ValueError('Bounded nonempty spool registry required')\n\
    \    return config, spools\n\n\ndef request_identity(target, commands, *, allow_completed=False):\n\
    \    if target.is_symlink() or not re.fullmatch('[a-f0-9]{32}', target.name):\n\
    \        raise ValueError('Unsafe execution directory')\n    request, fingerprint\
    \ = read_json(target / 'request.json')\n    if request['execution_id'] != target.name:\n\
    \        raise ValueError('Execution ID mismatch')\n    receipt_path = target\
    \ / 'execution.json'\n    uncertain = False\n    if receipt_path.exists() or receipt_path.is_symlink():\n\
    \        receipt, _ = read_json(receipt_path)\n        if receipt.get('request_sha256')\
    \ != fingerprint or receipt.get('binding') != request['binding']:\n          \
    \  raise ValueError('Receipt identity mismatch')\n        completed = receipt.get('stopped_confirmed')\
    \ is True and receipt.get('state') in TERMINAL\n        # Completed requests from\
    \ a prior environment are immutable history.\n        # Only new/pending requests\
    \ must match this deployment's command registry.\n        if completed and not\
    \ allow_completed:\n            return None\n        uncertain = not completed\n\
    \    tool = request['command']['tool']\n    if tool not in commands or commands[tool].document()\
    \ != request['command']:\n        raise ValueError('Request differs from registered\
    \ command')\n    return dict(target=str(target), sha256=fingerprint, tool=tool,\
    \ uncertain=uncertain,\n                order=(target / 'request.json').stat().st_mtime_ns)\n\
    \n\ndef pending(spools):\n    result = []\n    for root, commands in spools.items():\n\
    \        for target in root.iterdir():\n            if not re.fullmatch('[a-f0-9]{32}',\
    \ target.name):\n                continue\n            if target.is_symlink():\n\
    \                raise ValueError('Execution symlink')\n            if not target.is_dir()\
    \ or not (target / 'request.json').exists():\n                continue\n     \
    \       row = request_identity(target, commands)\n            if row is not None:\n\
    \                result.append(row)\n    return result\n\n\ndef tick(spools, state_path,\
    \ stopping=lambda: False, execute=run):\n    \"\"\"Run at most one request; never\
    \ clear ownership on an ambiguous exit.\"\"\"\n    state = read_json(state_path)[0]\
    \ if state_path.exists() else {'phase': 'idle'}\n    if state.get('phase') not\
    \ in {'idle', 'active'}:\n        raise ValueError('Unknown unified worker state')\n\
    \    rows = pending(spools)\n    if state['phase'] == 'active':\n        active\
    \ = state['execution']\n        target = Path(active['target'])\n        if target.parent\
