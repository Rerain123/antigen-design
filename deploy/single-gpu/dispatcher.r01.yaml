apiVersion: v1
kind: ConfigMap
metadata:
  name: antigen-gpu-dispatcher-code-r01
  namespace: him-ws
immutable: true
data:
  gpu_dispatch.py: "\"\"\"Single-slot GPU dispatcher. Uses committed resident requests,\
    \ not business jobs.\n\nOnly a dedicated GPU Deployment is changed. The service\
    \ Deployment is never\nrestarted by this loop. Kubernetes deletion is confirmed\
    \ before another mode\nstarts; ambiguous process receipts block replay rather\
    \ than rerunning work.\n\"\"\"\nfrom __future__ import annotations\n\nimport argparse\n\
    import hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport re\n\
    import ssl\nimport time\nimport urllib.request\n\nfrom .resident_process import\
    \ atomic\n\nTERMINAL = {'succeeded', 'failed', 'cancelled', 'timed_out', 'interrupted'}\n\
    \n\ndef candidate(root, mode, commands):\n    result = []\n    for target in Path(root).iterdir():\n\
    \        if not re.fullmatch('[a-f0-9]{32}', target.name) or target.is_symlink()\
    \ or not target.is_dir():\n            continue\n        request_path = target\
    \ / 'request.json'\n        if not request_path.exists():\n            continue\n\
    \        if request_path.is_symlink() or request_path.stat().st_size > 1024 **\
    \ 2:\n            raise ValueError('Unsafe resident request')\n        raw = request_path.read_bytes()\n\
    \        request = json.loads(raw)\n        tool = request['command']['tool']\n\
    \        if request['execution_id'] != target.name or commands.get(tool) != request['command']:\n\
    \            raise ValueError('Request differs from operator command registry')\n\
    \        fingerprint = hashlib.sha256(raw).hexdigest()\n        receipt_path =\
    \ target / 'execution.json'\n        if receipt_path.exists():\n            if\
    \ receipt_path.is_symlink():\n                raise ValueError('Symlink receipt')\n\
    \            receipt = json.loads(receipt_path.read_bytes())\n            if receipt.get('binding')\
    \ != request['binding'] or receipt.get('request_sha256') != fingerprint:\n   \
    \             raise ValueError('Receipt identity mismatch')\n            if receipt.get('stopped_confirmed')\
    \ is True and receipt.get('state') in TERMINAL:\n                continue\n  \
    \          # Even if an old Pod disappeared, never automatically replay uncertain\
    \ work.\n            result.append({'uncertain': True, 'mode': mode, 'target':\
    \ str(target), 'sha256': fingerprint})\n            continue\n        result.append({'uncertain':\
    \ False, 'mode': mode, 'target': str(target),\n                       'sha256':\
    \ fingerprint, 'order': request_path.stat().st_mtime_ns})\n    return result\n\
    \n\ndef choose(rows):\n    if any(row['uncertain'] for row in rows):\n       \
    \ raise RuntimeError('Unconfirmed prior execution requires recovery; no GPU switch\
    \ allowed')\n    return min(rows, key=lambda row: (row['order'], row['mode'],\
    \ row['target'])) if rows else None\n\n\ndef next_action(state, deployment, pods,\
    \ pending):\n    \"\"\"Pure transition policy. State intent must be persisted\
    \ before a mutation.\"\"\"\n    phase = state.get('phase', 'idle')\n    replicas\
    \ = deployment['spec'].get('replicas', 1)\n    if phase == 'idle':\n        if\
    \ replicas != 0 or pods:\n            raise RuntimeError('Idle dispatcher found\
    \ an unexpected slot owner')\n        if pending:\n            if pending['uncertain']:\n\
    \                raise RuntimeError('Unconfirmed prior execution')\n         \
    \   return 'reserve'\n        return 'wait'\n    execution = state['execution']\n\
    \    if phase == 'reserved':\n        annotation = deployment['spec']['template']['metadata'].get('annotations',\
    \ {})\n        if replicas == 1:\n            if annotation.get('antigen-design/execution-sha256')\
    \ != execution['sha256'] or annotation.get('antigen-design/execution-target')\
    \ != execution['target']:\n                raise RuntimeError('Slot deployment\
    \ drift')\n            return 'observe'  # A crash after patch must not submit\
    \ a second workload.\n        if pods:\n            return 'wait'\n        return\
    \ 'start'\n    if phase == 'running':\n        annotation = deployment['spec']['template']['metadata'].get('annotations',\
    \ {})\n        if annotation.get('antigen-design/execution-sha256') != execution['sha256']\
    \ or annotation.get('antigen-design/execution-target') != execution['target']:\n\
    \            raise RuntimeError('Running slot identity changed')\n        if state.get('confirmed_terminal'):\n\
    \            return 'release'\n        if not pods and replicas == 0:\n      \
    \      raise RuntimeError('Slot disappeared before stop confirmation')\n     \
    \   if any(p.get('status', {}).get('phase') in ('Failed', 'Succeeded') for p in\
    \ pods):\n            raise RuntimeError('Worker ended without a confirmed resident\
    \ receipt')\n        return 'wait'\n    if phase == 'releasing':\n        if replicas\
    \ != 0:\n            return 'release'\n        return 'wait' if pods else 'complete'\n\
    \    raise ValueError('Unknown dispatcher phase')\n\n\nclass Kubernetes:\n   \
    \ def __init__(self, namespace, name):\n        self.namespace, self.name = namespace,\
    \ name\n        self.base = 'https://' + os.environ['KUBERNETES_SERVICE_HOST']\
    \ + ':' + os.environ.get('KUBERNETES_SERVICE_PORT', '443')\n        self.token\
    \ = Path('/var/run/secrets/kubernetes.io/serviceaccount/token')\n        self.tls\
    \ = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')\n\
    \n    def request(self, path, method='GET', body=None):\n        data = json.dumps(body).encode()\
    \ if body is not None else None\n        headers = {'Authorization': 'Bearer '\
    \ + self.token.read_text().strip()}\n        if data is not None:\n          \
    \  headers['Content-Type'] = 'application/json-patch+json'\n        request =\
    \ urllib.request.Request(self.base + path, data=data, headers=headers, method=method)\n\
    \        with urllib.request.urlopen(request, context=self.tls, timeout=20) as\
    \ response:\n            return json.load(response)\n\n    @property\n    def\
    \ path(self):\n        return f'/apis/apps/v1/namespaces/{self.namespace}/deployments/{self.name}'\n\
    \n    def deployment(self):\n        return self.request(self.path)\n\n    def\
    \ pods(self):\n        # Inspect all project holders, not only pods created by\
    \ this dispatcher.\n        return self.request(f'/api/v1/namespaces/{self.namespace}/pods')['items']\n\
    \n    def patch(self, live, changes):\n        return self.request(self.path,\
    \ 'PATCH', [\n            {'op': 'test', 'path': '/metadata/uid', 'value': live['metadata']['uid']},\n\
    \            {'op': 'test', 'path': '/metadata/resourceVersion', 'value': live['metadata']['resourceVersion']},\n\
    \            *changes])\n\n\ndef tick(config, state_path, api):\n    state = json.loads(state_path.read_bytes())\
    \ if state_path.exists() else {'phase': 'idle'}\n    deployment = api.deployment()\n\
    \    if deployment['spec']['strategy'] != {'type': 'Recreate'}:\n        raise\
    \ RuntimeError('Single-slot deployment must use Recreate')\n    if deployment['spec'].get('replicas',\
    \ 1) not in (0, 1):\n        raise RuntimeError('Multiple slot replicas are forbidden')\n\
    \    all_pods = api.pods()\n    pods = [p for p in all_pods if p['metadata'].get('labels',\
    \ {}).get('app') == config['deployment']]\n    if len(pods) > 1:\n        raise\
    \ RuntimeError('Multiple slot Pods are forbidden')\n    for pod in all_pods:\n\
    \        if pod in pods or not pod['metadata']['name'].startswith('antigen-'):\n\
    \            continue\n        if pod['status']['phase'] in ('Succeeded', 'Failed'):\n\
    \            continue\n        containers = pod['spec'].get('containers', [])\
    \ + pod['spec'].get('initContainers', [])\n        if any(c.get('resources', {}).get(k,\
    \ {}).get('nvidia.com/gpu') for c in containers for k in ('limits', 'requests')):\n\
    \            raise RuntimeError('Another project GPU holder remains')\n    pending\
    \ = None\n    if state.get('phase', 'idle') == 'idle':\n        rows = []\n  \
    \      for mode, definition in config['modes'].items():\n            rows += candidate(definition['root'],\
    \ mode, definition['commands'])\n        pending = choose(rows)\n    if state.get('phase')\
    \ == 'running':\n        target = Path(state['execution']['target'])\n       \
    \ receipt_path = target / 'execution.json'\n        state['confirmed_terminal']\
    \ = False\n        if receipt_path.exists():\n            request = json.loads((target\
    \ / 'request.json').read_bytes())\n            receipt = json.loads(receipt_path.read_bytes())\n\
    \            if receipt.get('request_sha256') != state['execution']['sha256']\
    \ or receipt.get('binding') != request['binding']:\n                raise ValueError('Active\
    \ receipt identity mismatch')\n            state['confirmed_terminal'] = receipt.get('stopped_confirmed')\
    \ is True and receipt.get('state') in TERMINAL\n    action = next_action(state,\
    \ deployment, pods, pending)\n    if action == 'reserve':\n        atomic(state_path,\
    \ {'phase': 'reserved', 'execution': pending})\n    elif action == 'start':\n\
    \        import copy\n        execution = state['execution']\n        if hashlib.sha256((Path(execution['target'])\
    \ / 'request.json').read_bytes()).hexdigest() != execution['sha256']:\n      \
    \      raise ValueError('Reserved request changed')\n        template = copy.deepcopy(config['modes'][execution['mode']]['template'])\n\
    \        containers = template['spec']['containers']\n        if len(containers)\
    \ != 1 or template['spec'].get('initContainers'):\n            raise ValueError('Exactly\
    \ one GPU worker container required')\n        limits = containers[0].get('resources',\
    \ {}).get('limits', {})\n        if str(limits.get('nvidia.com/gpu')) != '1' or\
    \ str(limits.get('nvidia.com/gpumem-percentage')) != '100' or str(limits.get('nvidia.com/gpucores'))\
    \ != '100':\n            raise ValueError('Expected one full GPU allocation')\n\
    \        if template['metadata'].get('annotations', {}).get('nvidia.com/use-gputype')\
    \ != 'A100-SXM-64GB':\n            raise ValueError('64GB type constraint required')\n\
    \        template['metadata'].setdefault('annotations', {}).update({\n       \
    \     'antigen-design/execution-sha256': execution['sha256'],\n            'antigen-design/execution-target':\
    \ execution['target']})\n        template['spec']['containers'][0].setdefault('env',\
    \ []).extend([\n            {'name': 'T01_GPU_EXECUTION_TARGET', 'value': execution['target']},\n\
    \            {'name': 'T01_GPU_EXECUTION_SHA256', 'value': execution['sha256']}])\n\
    \        api.patch(deployment, [{'op': 'replace', 'path': '/spec/template', 'value':\
    \ template},\n                               {'op': 'replace', 'path': '/spec/replicas',\
    \ 'value': 1}])\n        atomic(state_path, {'phase': 'running', 'execution':\
    \ execution})\n    elif action == 'observe':\n        atomic(state_path, {'phase':\
    \ 'running', 'execution': state['execution']})\n    elif action == 'release':\n\
    \        atomic(state_path, {'phase': 'releasing', 'execution': state['execution']})\n\
    \        api.patch(deployment, [{'op': 'replace', 'path': '/spec/replicas', 'value':\
    \ 0}])\n    elif action == 'complete':\n        atomic(state_path, {'phase': 'idle',\
    \ 'last_execution': state['execution']})\n    return action\n\n\ndef main():\n\
    \    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument('--config',\
    \ type=Path, required=True)\n    parser.add_argument('--state', type=Path, required=True)\n\
    \    args = parser.parse_args()\n    config = json.loads(args.config.read_bytes())\n\
    \    args.state.parent.mkdir(parents=True, exist_ok=True)\n    # A lifetime OS\
    \ lock prevents two controller processes on this shared volume.\n    import fcntl\n\
    \    with args.state.with_suffix('.lock').open('a') as lock:\n        fcntl.flock(lock,\
    \ fcntl.LOCK_EX | fcntl.LOCK_NB)\n        api = Kubernetes(config['namespace'],\
    \ config['deployment'])\n        while True:\n            try:\n             \
    \   action = tick(config, args.state, api)\n                if action != 'wait':\n\
    \                    print(json.dumps({'event': 'gpu_dispatch', 'action': action}),\
    \ flush=True)\n            except Exception as exc:\n                # Fail closed:\
    \ no rollback to a second GPU and no replay of work.\n                print(json.dumps({'event':\
    \ 'gpu_dispatch_blocked', 'error_type': type(exc).__name__}), flush=True)\n  \
    \          time.sleep(2)\n\n\nif __name__ == '__main__':\n    main()\n"
  gpu_once.py: "\"\"\"Execute exactly one operator-registered resident request on\
    \ one approved GPU.\"\"\"\nimport argparse\nimport hashlib\nimport math\nimport\
    \ os\nfrom pathlib import Path\nimport signal\nimport subprocess\nimport time\n\
    \nfrom .resident_worker import commands_from_file\nfrom .resident_process import\
    \ run\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--root',\
    \ type=Path, required=True)\n    parser.add_argument('--config', type=Path, required=True)\n\
    \    parser.add_argument('--uuid', required=True)\n    args = parser.parse_args()\n\
    \    target = Path(os.environ['T01_GPU_EXECUTION_TARGET'])\n    if target.parent\
    \ != args.root or target.is_symlink():\n        raise ValueError('Execution outside\
    \ registered spool')\n    raw = (target / 'request.json').read_bytes()\n    if\
    \ hashlib.sha256(raw).hexdigest() != os.environ['T01_GPU_EXECUTION_SHA256']:\n\
    \        raise ValueError('Request identity mismatch')\n    rows = [r.split(',')\
    \ for r in subprocess.check_output([\n        'nvidia-smi', '--query-gpu=name,uuid,memory.total',\
    \ '--format=csv,noheader,nounits'], text=True).strip().splitlines()]\n    if len(rows)\
    \ != 1 or rows[0][0].strip() != 'NVIDIA A100-SXM-64GB' or rows[0][1].strip() !=\
    \ args.uuid or not math.isfinite(float(rows[0][2])) or float(rows[0][2]) < 60000:\n\
    \        raise ValueError('Expected single approved 64GB GPU')\n    import json\n\
    \    request = json.loads(raw)\n    commands = commands_from_file(args.config)\n\
    \    command = commands[request['command']['tool']]\n    os.environ['T01_PROCESS_REGISTRY']\
    \ = str(args.root / '.processes')\n    stopping = [False]\n    signal.signal(signal.SIGTERM,\
    \ lambda *unused: stopping.__setitem__(0, True))\n    signal.signal(signal.SIGINT,\
    \ lambda *unused: stopping.__setitem__(0, True))\n    receipt = run(target, command,\
    \ lambda: stopping[0])\n    print(json.dumps({'event': 'gpu_once_complete', 'state':\
    \ receipt['state'], 'stopped_confirmed': receipt['stopped_confirmed']}), flush=True)\n\
    \    # Keep Deployment from restarting a completed worker until controller scales\
    \ down.\n    while not stopping[0]:\n        time.sleep(1)\n\n\nif __name__ ==\
    \ '__main__':\n    main()\n"
