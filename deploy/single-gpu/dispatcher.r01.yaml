    ,\n                  \"name\": \"esmfold2-code\",\n                  \"readOnly\"\
    : true,\n                  \"subPath\": \"t01_phase1_real/resident_process.py\"\
    \n                },\n                {\n                  \"mountPath\": \"/opt/t01/worker.json\"\
    ,\n                  \"name\": \"resident-config\",\n                  \"readOnly\"\
    : true,\n                  \"subPath\": \"gpu.worker.json\"\n                },\n\
    \                {\n                  \"name\": \"gpu-dispatch-code\",\n     \
    \             \"mountPath\": \"/opt/t01/src/t01_phase1_real/gpu_once.py\",\n \
