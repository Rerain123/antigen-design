    r03-quality: "\"\"\"SOP v10.5 S-09 for already verified normalized ESMFold2 confidence.\"\
      \"\"\nimport math\n\nDEFAULTS = dict(high_plddt=0.70, medium_plddt=0.50, topology_ptm=0.50,\n\
      \                low_plddt=0.50, min_region_length=5, merge_gap=3)\n\n\ndef\
      \ assess(scores, ptm, parameters=None, source='esmfold2_predicted'):\n    p\
      \ = dict(DEFAULTS if parameters is None else parameters)\n    if (set(p) !=\
      \ set(DEFAULTS) or source not in ('esmfold2_predicted','af3_predicted')\n  \
      \          or not scores or any(not math.isfinite(s) or not 0 <= s <= 1 for\
      \ s in scores)):\n        raise ValueError('Invalid verified confidence or S09\
      \ parameters')\n    mean = math.fsum(scores)/len(scores)\n    regions = [];\
      \ start = None\n    for pos, score in enumerate([*scores, 1.0], 1):\n      \
      \  if score < p['low_plddt'] and start is None: start = pos\n        if score\
      \ >= p['low_plddt'] and start is not None:\n            if pos-start >= p['min_region_length']:\
      \ regions.append(dict(start=start, end=pos-1))\n            start = None\n \
      \   merged = []\n    for r in regions:\n        if merged and r['start']-merged[-1]['end']-1\
      \ <= p['merge_gap']: merged[-1]['end'] = r['end']\n        else: merged.append(dict(r))\n\
      \    quality = dict(confidence='high' if mean >= p['high_plddt'] else 'medium'\
      \ if mean >= p['medium_plddt'] else 'low',\n                   topology_reliable=ptm\
      \ is not None and ptm >= p['topology_ptm'], low_confidence_regions=merged)\n\
      \    return dict(structure=dict(source=source, mean_plddt=mean, plddt_per_residue=scores,\n\
      \                               ptm=ptm, **quality), quality=quality, parameters=p,\n\
      \                rule_basis='AgentA_SOP_v10.5_20260902 S-09; ToolSpec_\u7ED3\
      \u6784\u9884\u6D4B\u83B7\u53D6\u94FE_v10.5 \xA72c/3',\n                calibration='E-06\
      \ defaults; not scientifically signed off',\n                scientific_gate='CLOSED',\
      \ usable_for_pipeline=False, automatic_handoff=False)\n"
    r03-structure-worker: "\"\"\"Fixed local structure chain inside the pinned offline\
      \ FreeSASA/Biopython image.\"\"\"\nfrom importlib.metadata import version\n\
      import hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\n\
      import platform\nimport socket\nimport sys\nimport traceback\n\nsys.path.insert(0,'/code')\n\
      from t01_structure_mapping.input_facts import inspect_input\nfrom t01_structure_mapping.probe\
      \ import parse_local, propose, ProbeError\nfrom t01_structure_mapping.freesasa_consumer\
      \ import prepare, validate_tool_atoms, join_areas, ConsumerError\nfrom quality\
      \ import assess, warning\nfrom normalization import normalize\n\nOUT=Path('/out/result')\n\
      sha=lambda raw:hashlib.sha256(raw).hexdigest()\n\n\ndef read(path):return json.loads(Path(path).read_bytes())\n\
      \n\ndef write(name,value):\n    raw=json.dumps(value,ensure_ascii=False,sort_keys=True,allow_nan=False).encode('utf-8')\n\
      \    with (OUT/name).open('xb') as stream:stream.write(raw)\n    return sha(raw)\n\
      \n\ndef calculate(prepared,profile):\n    import freesasa\n    config=profile['calculation']\n\
      \    classifier=freesasa.Classifier.getStandardClassifier(config['classifier'])\n\
      \    radii=[dict(raw_row_index=a['raw_row_index'],radius=classifier.radius(a['residue_name'],a['atom_name']))\
      \ for a in prepared['atoms']]\n    write('classifier.json',radii)\n    if any(not\
      \ math.isfinite(r['radius']) or r['radius']<=0 for r in radii):raise ConsumerError('UNKNOWN_PROTOR_RADIUS','\u4E0D\
      \u731C\u6D4B\u672A\u77E5\u539F\u5B50\u7684\u534A\u5F84')\n    structure=freesasa.Structure(classifier=classifier,options=config['structure_options'])\n\
      \    for atom in prepared['atoms']:\n        structure.addAtom(atom['tool_atom_name'],atom['residue_name'],atom['tool_residue_token'],atom['chain_id'],*atom['coordinate_tool'])\n\
      \    observed=[dict(tool_atom_index=i,chain_id=structure.chainLabel(i),tool_residue_token=structure.residueNumber(i).strip(),\n\
      \        raw_tool_residue_number=structure.residueNumber(i),residue_name=structure.residueName(i).strip(),atom_name=structure.atomName(i).strip(),\n\
      \        raw_tool_atom_name=structure.atomName(i),coordinate=list(structure.coord(i)),radius=structure.radius(i))\
      \ for i in range(structure.nAtoms())]\n    write('tool_atoms.json',observed)\n\
      \    verified=validate_tool_atoms(prepared,observed)\n    expected={r['raw_row_index']:r['radius']\
      \ for r in radii}\n    if any(r['radius']!=expected[r['raw_row_index']] for\
      \ r in verified):raise ConsumerError('TOOL_RADIUS_MISMATCH','\u5B9E\u9645\u534A\
      \u5F84\u4E0E ProtOr \u5206\u7C7B\u4E0D\u540C')\n    write('verified_atoms.json',verified)\n\
      \    write('calculation-started.json',dict(route='native_atoms',atom_count=structure.nAtoms()))\n\
      \    result=freesasa.calc(structure,freesasa.Parameters(config['parameters']))\n\
      \    areas=[dict(tool_atom_index=i,absolute_sasa_a2=result.atomArea(i)) for\
      \ i in range(result.nAtoms())]\n    total=result.totalArea();summed=math.fsum(r['absolute_sasa_a2']\
      \ for r in areas)\n    if any(not math.isfinite(r['absolute_sasa_a2']) or r['absolute_sasa_a2']<0\
      \ for r in areas) or not math.isfinite(total):\n        (OUT/'nonfinite_numeric.txt').write_text(repr((total,areas)))\n\
      \        raise ConsumerError('INVALID_NUMERIC_OUTPUT','\u975E\u6709\u9650\u539F\
      \u59CB\u9762\u79EF\uFF0C\u4E0D\u7528\u4E8E\u5F52\u4E00\u5316')\n    write('raw_areas.json',dict(total_sasa_a2=total,atom_areas=areas,parameters=config['parameters']))\n\
      \    if total<0 or abs(total-summed)>math.ulp(max(total,summed))*max(1,len(areas)):raise\
      \ ConsumerError('TOTAL_AREA_MISMATCH','\u603B\u9762\u79EF\u4E0E\u9010\u539F\u5B50\
      \u9762\u79EF\u4E4B\u548C\u4E0D\u4E00\u81F4')\n    joined=join_areas(prepared,observed,areas)\n\
      \    write('raw_residue_areas.json',joined)\n    return dict(status='executed',calculation_started=True,atom_count=len(areas),residue_count=len(joined['residues']),\n\
      \        total_sasa_a2=total,route='native_atoms',raw_residues=joined['residues'],error_code=None)\n\
      \n\ndef run(request,binding,profile):\n    data=Path('/input.structure').read_bytes();sequence=request['protein_sequence']\n\
      \    if sha(data)!=binding['structure_sha256'] or sha(sequence.encode())!=binding['sequence_sha256']\
      \ or sha(Path('/input.json').read_bytes())!=binding['input_sha256']:\n     \
      \   raise ValueError('Input does not match durable task binding')\n    facts=inspect_input(data,declared_format=request['declared_format'],**request['selection'])\n\
      \    for name,fact in facts.items():write(name+'.json',dict(fact,binding=binding))\n\
      \    pf=facts['preflight']\n    report=dict(binding=binding,input=dict(protein_sequence=sequence,host_species=request['host_species'],structure_name=request['structure_name'],\n\
      \        structure_artifact=request['structure_artifact'],source_declaration=request['source_declaration']),mapping=None,quality=None,\n\
      \        freesasa=dict(status='blocked',calculation_started=False,error_code=None),rsa=None,\n\
      \        status='review_required',warnings=[],steps=[],scientific_signoff=None,usable_for_pipeline=False,automatic_handoff=False,\n\
      \        method_summary=dict(profile_id=profile['profile_id'],profile_version=profile['version'],profile_sha256=sha(Path('/profile.json').read_bytes()),\n\
      \            runtime=profile['runtime'],calculation=profile['calculation'],normalization=profile['normalization'],\n\
      \            selected_context_chain_ids=request['context_chain_ids'],source_selection=request['selection'],scientific_approval=None,\n\
      \            completeness_policy='OI-023: no heavy-atom percentage inferred\
      \ or side-chain repair',\n            sources=read('/worker/sources.json')['files']))\n\
      \    def step(name,status,reason=None):\n        report['steps'].append(dict(step=name,status=status,reason=reason));print(name,status,reason\
      \ or '',flush=True)\n    step('input_facts','executed' if pf['status']=='ready_for_review'\
      \ else 'rejected',pf['error_code'])\n    if pf['status']!='ready_for_review':\n\
      \        report['status']='input_rejected';report['error_code']=pf['error_code']\n\
      \        report['warnings'] += [warning(d['code'],d['message']) for d in pf['diagnostics']]\n\
      \        for name in ['parse_and_mapping','S-09','FreeSASA','RSA']:step(name,'blocked','INPUT_PREFLIGHT_REJECTED')\n\
      \        return report\n    try:\n        inventory=parse_local('/input.structure');write('inventory.json',dict(inventory,binding=binding))\n\
      \        mapping=propose(sequence,inventory,evidence_kind='G0_REAL_OUTPUT',model_index=request['selection']['model_index'],\n\
      \            requested_chain=None if request['selection']['chain_selector']=='AUTO'\
      \ else request['selection']['chain_selector'])\n        mapping['binding']=binding;report['mapping']=mapping;write('mapping.json',mapping)\n\
      \        step('parse_and_mapping','executed',mapping['mapping_status'])\n  \
      \      report['warnings'] += [warning(i['code'],i['message']) for i in mapping['issues']]\n\
      \    except (ProbeError,ValueError,KeyError,TypeError) as exc:\n        step('parse_and_mapping','review_required','MAPPING_PARSE_REVIEW')\n\
      \        report['warnings'].append(warning('MAPPING_PARSE_REVIEW',str(exc)));mapping=None\n\
      \    quality=assess(request['source_declaration'],facts['raw_metadata'])\n \
      \   if request['structure_artifact']['evidence_kind']=='G0_REAL_OUTPUT':\n \
      \       evidence=read(Path('/input.json').resolve().with_name('prediction-evidence.json'))\n\
      \        if (evidence['binding']!=binding or evidence['structure_artifact']!=request['structure_artifact']\n\
      \            or request['source_declaration']['kind']!='predicted'\n       \
      \     or evidence['quality']['scientific_gate']!='CLOSED'\n            or evidence['quality']['usable_for_pipeline']\
      \ is not False):\n            raise ValueError('Verified prediction evidence\
      \ differs from structure input')\n        q=evidence['quality']\n        quality.update(status='evaluated_unverified',structure=q['structure'],quality=q['quality'],\n\
      \            low_confidence_regions=q['quality']['low_confidence_regions'],\n\
      \            s11_quality_condition=q['quality']['confidence']!='low',\n    \
      \        warnings=[warning('ENGINEERING_OCCUPANCY_CONVENTION',\n           \
      \     'User-authorized tool copy uses occupancy=1.0; native CIF retained; scientific\
      \ qualification closed','quality')],\n            rule_basis=q['rule_basis'],prediction_evidence=evidence)\n\
      \    quality['structure'].update(quality['quality'] or dict(confidence=None,topology_reliable=None,low_confidence_regions=None))\n\
      \    quality['binding']=binding;write('quality.json',quality);report['quality']=quality\n\
      \    report['warnings'] += quality['warnings'];step('S-09',quality['status'])\n\
      \    blocked=None\n    if quality['s11_quality_condition'] is False:\n     \
      \   report['freesasa']['status']='skipped';blocked='QUALITY_LOW'\n    elif quality['s11_quality_condition']\
      \ is None:blocked='QUALITY_REVIEW_REQUIRED'\n    elif not mapping or mapping['target_chain_id']\
      \ is None:blocked='MAPPING_NOT_UNIQUE'\n    elif any(i['code']=='BACKBONE_ATOMS_ABSENT'\
      \ for i in mapping['issues']):blocked='BACKBONE_ATOMS_ABSENT'\n    if blocked:\n\
      \        report['freesasa']['error_code']=blocked;step('FreeSASA',report['freesasa']['status'],blocked);step('RSA','blocked',blocked)\n\
      \        report['warnings'].append(warning(blocked,'\u7ED3\u6784\u4F9D\u8D56\
      \u8BA1\u7B97\u672A\u6267\u884C\uFF1B\u8BF7\u67E5\u770B\u8D28\u91CF\u3001\u5019\
      \u9009\u6620\u5C04\u6216\u539F\u5B50\u5B8C\u6574\u6027\u4FE1\u606F'))\n    \
      \    return report\n    try:\n        prepared=prepare(data,facts,route='native_atoms',model_index=pf['ingestion_observation']['model_index'],context_chain_ids=request['context_chain_ids'])\n\
      \        prepared.pop('pdb_text');prepared['binding']=binding\n        # R-58\
      \ joins may use integer keys only after the lossless raw projection agrees.\n\
      \        unsupported=[r for r in facts['raw_addresses']['residues'] if r['model_index']==mapping['model_index']\
      \ and r['residue_class']!='nonprotein'\n            and r['address']['auth_asym_id'][0]==mapping['target_chain_id']\
      \ and not r['consumers']['integer_mapping_v0_1']['representable']]\n       \
      \ if unsupported:raise ConsumerError('MAPPING_ADDRESS_REVIEW','\u539F\u59CB\u4F5C\
      \u8005\u7F16\u53F7\u4E0D\u80FD\u65E0\u635F\u6295\u5F71\u5230\u73B0\u6709\u5019\
      \u9009\u6620\u5C04\u952E',unsupported)\n        write('preparation.json',prepared)\n\
      \        report['freesasa']=calculate(prepared,profile);step('FreeSASA','executed')\n\
      \        report['rsa']=normalize(mapping,facts['raw_addresses']['residues'],report['freesasa'].pop('raw_residues'),profile['normalization']['max_asa_a2'])\n\
      \        write('rsa.json',dict(report['rsa'],binding=binding));step('RSA',report['rsa']['status'],report['rsa']['error_code'])\n\
      \        if report['rsa']['out_of_domain']:report['warnings'].append(warning('RSA_OUT_OF_DOMAIN','\u4FDD\
      \u7559\u539F\u59CB\u9762\u79EF\u548C\u6BD4\u503C\uFF1B\u4E0D\u622A\u65AD\u3001\
      \u4E0D\u8F93\u51FA\u6B63\u5E38 RSA\uFF1BOI-027 \u9700\u8981\u7B97\u6CD5\u786E\
      \u8BA4'))\n        if report['rsa']['missing_positions']:report['warnings'].append(warning('MISSING_STRUCTURE_RESIDUES','\u7F3A\
      \u5931\u8F93\u5165\u4F4D\u7F6E\u4FDD\u7559 null\uFF0Cburied_fraction \u7684\u5206\
      \u6BCD\u4ECD\u4E3A\u5B8C\u6574\u5E8F\u5217\u957F\u5EA6'))\n    except ConsumerError\
      \ as exc:\n        report['freesasa'].update(status='review_required',error_code=exc.code,calculation_started=(OUT/'calculation-started.json').is_file())\n\
      \        write('consumer-diagnostic.json',dict(code=exc.code,message=str(exc),details=exc.details,binding=binding))\n\
      \        report['warnings'].append(warning(exc.code,str(exc)));step('FreeSASA','review_required',exc.code);step('RSA','blocked',exc.code)\n\
      \    return report\n\n\ndef main():\n    started=dict(python=platform.python_version(),freesasa=version('freesasa'),biopython=version('biopython'),numpy=version('numpy'))\n\
      \    runtime=dict(packages=started,network_interfaces=socket.if_nameindex(),cpu_affinity=sorted(os.sched_getaffinity(0)),\n\
      \        source_modules_modified=False,tool='LOCAL_STRUCTURE_ANALYSIS',python_exit_code=None)\n\
      \    Path('/out/runtime_started.json').write_text(json.dumps(runtime))\n   \
      \ OUT.mkdir(exist_ok=False)\n    try:\n        profile=read('/profile.json')\n\
      \        if any(v!=profile['runtime'][k] for k,v in started.items()):raise ValueError('Runtime\
      \ packages differ from pinned FreeSASA profile')\n        report=run(read('/input.json'),read('/binding.json'),profile)\n\
      \        write('analysis.json',report);runtime['python_exit_code']=0\n    except\
      \ BaseException as exc:\n        runtime.update(python_exit_code=1,error_type=type(exc).__name__,error=str(exc))\n\
      \        (OUT/'exception.txt').write_text(traceback.format_exc())\n        raise\n\
      \    finally:\n        runtime['native_output_sha256']={p.relative_to(Path('/out')).as_posix():sha(p.read_bytes())\
      \ for p in sorted(OUT.rglob('*')) if p.is_file()}\n        Path('/out/runtime.json').write_text(json.dumps(runtime))\n\
      \n\nif __name__=='__main__':main()\n"
    r04-t01-phase1-real-development-esm-if1-source-py: "\"\"\"Verified N11 generation\
      \ records, WT source and optional execution-bound baseline.\"\"\"\nfrom ...common\
      \ import encode,decode,ensure,sha\nfrom ..proteinmpnn import policy as mpnn\n\
      from ..proteinmpnn.source import sources as structure_sources\nfrom ..proteinmpnn.result\
      \ import parse as parse_mpnn\nfrom . import policy\n\n\ndef registered(rt,db,ref,tool):\n\
      \    job,raw,value=rt._registered_result_artifact(db,ref,tool)\n    ensure(job['state']=='succeeded'\
      \ and value['qualification']=='DEVELOPMENT_UNREVIEWED'\n        and value['scientific_signoff']\
      \ is None,'OUTPUT_INVALID','Successful unreviewed engineering source required')\n\
      \    request_raw=rt._input(db,job['request_artifact'],job['run_id']);request=decode(request_raw)\n\
      \    ensure(value['binding']['input_sha256']==sha(request_raw) and all(value['binding'][k]==job[k]\n\
      \        for k in ('request_id','execution_identity','execution_profile','rule_profile')),\n\
      \        'OUTPUT_INVALID','Source request/execution identity differs')\n   \
      \ files={}\n    for item in value['raw_artifacts']:\n        ensure(item['path']\
      \ not in files and item['artifact'] in job['artifacts'],'OUTPUT_INVALID','Foreign\
      \ or duplicate source artifact')\n        files[item['path']]=rt.artifact_bytes(job['job_id'],item['artifact']['artifact_id'])\n\
      \    ensure(files['input.json']==request_raw,'OUTPUT_INVALID','Source executed\
      \ request differs')\n    return job,raw,value,request,files\n\n\ndef sources(rt,db,body,expected_run_id=None):\n\
      \    job,raw,value,n11,native=registered(rt,db,body['n11_artifact'],mpnn.TOOL)\n\
      \    if expected_run_id is not None:\n        ensure(body['n11_artifact']['run_id']==expected_run_id\
      \ and job['run_id']==expected_run_id,\n            'FORBIDDEN','N12 N11 source\
      \ belongs to another run')\n    ensure(n11['protein_sequence']==body['protein_sequence']\
      \ and n11['structure_artifact']==body['structure_artifact'],\n        'OUTPUT_INVALID','N11\
      \ WT sequence/structure differs from N12 request')\n    generated=parse_mpnn(n11,native)\n\
      \    ensure(value['generation']==generated and value['binding']['sequence_sha256']==sha(body['protein_sequence'].encode()),\n\
      \        'OUTPUT_INVALID','N11 records differ from verified native output')\n\
      \    prepared,structure_receipt=structure_sources(rt,db,n11,expected_run_id=expected_run_id)\n\
      \    ensure(all(native[name]==data for name,data in prepared.items()),'HASH_MISMATCH','N11\
      \ structure snapshot differs from current registered source')\n    available={r['sample_number']:r\
      \ for r in generated['records']}\n    ensure(all(n in available for n in body['sample_numbers']),'INVALID_REQUEST','Requested\
      \ N11 sample does not exist')\n    records=[available[n] for n in body['sample_numbers']]\n\
      \    for record in records:\n        actual=[dict(position=p,wt_residue=w,mut_residue=m,source='ProteinMPNN')\n\
      \            for p,(w,m) in enumerate(zip(body['protein_sequence'],record['sequence']),1)\
      \ if w!=m]\n        ensure(record['mutations']==actual,'OUTPUT_INVALID','N11\
      \ mutations differ from sequence')\n    conversion=generated['conversion'];assets=decode((policy.HERE/'assets.json').read_bytes())\n\
      \    signature=dict(wt_sequence_sha256=sha(body['protein_sequence'].encode()),\n\
      \        source_structure_sha256=structure_receipt['source_sha256'],wt_pdb_sha256=sha(prepared['native/target.pdb']),\n\
      \        conversion_sha256=sha(prepared['native/conversion.json']),mapping_sha256=sha(prepared['input/mapping.json']),\n\
      \        target_chain=conversion['target_chain'],chain_sequences=conversion['chain_sequences'],\n\
      \        chain_order=list(dict.fromkeys(r['chain_id'] for r in conversion['rows'])),model=policy.MODEL,commit=policy.COMMIT,image=policy.IMAGE,\n\
      \        source_manifest_sha256=assets['archive_sha256'],parameters=policy.PARAMETERS,execution_profile=policy.registered_profile())\n\
      \    files={'input/n11-result.json':raw,'input/n11-request.json':encode(n11),\n\
      \        'native/wt.pdb':prepared['native/target.pdb'],'native/conversion.json':prepared['native/conversion.json']}\n\
      \    # All N11 raw artifacts are checked above; retain its executed inputs/outputs\
      \ used in semantic verification.\n    for name,data in native.items():\n   \
      \     if name in ('input.json','input.fasta') or name.startswith(('input/','native/','output/','resident/')):files['input/n11/'+name]=data\n\
      \    baseline=None;baseline_receipt=None\n    if body['baseline_artifact'] is\
      \ not None:\n        bj,braw,bvalue,brequest,bfiles=registered(rt,db,body['baseline_artifact'],policy.TOOL)\n\
      \        ensure(bj['execution_profile']==policy.registered_profile(),'OUTPUT_INVALID','Baseline\
      \ execution profile/model has changed')\n        from .result import validate_observation\n\
      \        observation=validate_observation(brequest,bfiles)\n        baseline=observation['baseline']\n\
      \        ensure(baseline is not None and baseline['signature']==signature and\
      \ bvalue['baseline']==baseline,\n            'OUTPUT_INVALID','Baseline WT structure/chain/mapping/model/parameters\
      \ differ')\n        baseline_receipt=dict(artifact=body['baseline_artifact'],baseline_sha256=sha(encode(baseline)),\n\
      \            original_job_id=baseline['origin_job_id'],reused_from_job_id=bj['job_id'])\n\
      \        files['input/baseline-result.json']=braw\n        files['input/baseline-observation.json']=bfiles['output/observation.json']\n\
      \    payload=dict(protein_sequence=body['protein_sequence'],records=records,baseline=baseline,signature=signature,\n\
      \        parameters=policy.PARAMETERS,source_n11=body['n11_artifact'],target_chain=conversion['target_chain'])\n\
      \    files['native/payload.json']=encode(payload)\n    receipt=dict(n11_artifact=body['n11_artifact'],n11_request=job['request_artifact'],\n\
      \        n11_profile=job['execution_profile'],n11_raw_artifacts=value['raw_artifacts'],structure=structure_receipt,\n\
      \        baseline=baseline_receipt,signature=signature,selected_sample_numbers=body['sample_numbers'],\n\
      \        prepared_hashes={n:sha(v) for n,v in files.items()})\n    return files,receipt\n"
    r04-t01-phase1-real-development-foldx-source-py: "\"\"\"Prepare a structure-bound\
      \ FoldX request and auditable mapping payload.\"\"\"\nfrom ...common import\
      \ decode, encode, ensure, sha\nfrom ..proteinmpnn.source import sources as structure_sources\n\
      from . import policy\n\n\ndef _foldx_token(row, mutation=None, scan=False):\n\
      \    if row.get(\"insertion_code\") not in (None, \"\", \" \"):\n        return\
      \ None\n    chain = row[\"chain_id\"]\n    # FoldX consumes the repaired canonical\
      \ PDB emitted by the projection; its\n    # auth_seq_id is therefore the reversible\
      \ tool_pdb_resseq (1-based).\n    resseq = row[\"tool_pdb_resseq\"]\n    wt\
      \ = row[\"residue\"]\n    if scan:\n        return wt + chain + str(resseq)\
      \ + \"a\"\n    # Position mapping rows record the address prefix before a concrete\n\
