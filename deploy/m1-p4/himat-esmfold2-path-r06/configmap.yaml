  r03-quality: "\"\"\"SOP v10.5 S-09 for already verified normalized ESMFold2 confidence.\"\
    \"\"\nimport math\n\nDEFAULTS = dict(high_plddt=0.70, medium_plddt=0.50, topology_ptm=0.50,\n\
    \                low_plddt=0.50, min_region_length=5, merge_gap=3)\n\n\ndef assess(scores,\
    \ ptm, parameters=None, source='esmfold2_predicted'):\n    p = dict(DEFAULTS if\
    \ parameters is None else parameters)\n    if (set(p) != set(DEFAULTS) or source\
    \ not in ('esmfold2_predicted','af3_predicted')\n            or not scores or\
    \ any(not math.isfinite(s) or not 0 <= s <= 1 for s in scores)):\n        raise\
    \ ValueError('Invalid verified confidence or S09 parameters')\n    mean = math.fsum(scores)/len(scores)\n\
    \    regions = []; start = None\n    for pos, score in enumerate([*scores, 1.0],\
    \ 1):\n        if score < p['low_plddt'] and start is None: start = pos\n    \
    \    if score >= p['low_plddt'] and start is not None:\n            if pos-start\
    \ >= p['min_region_length']: regions.append(dict(start=start, end=pos-1))\n  \
    \          start = None\n    merged = []\n    for r in regions:\n        if merged\
    \ and r['start']-merged[-1]['end']-1 <= p['merge_gap']: merged[-1]['end'] = r['end']\n\
    \        else: merged.append(dict(r))\n    quality = dict(confidence='high' if\
    \ mean >= p['high_plddt'] else 'medium' if mean >= p['medium_plddt'] else 'low',\n\
    \                   topology_reliable=ptm is not None and ptm >= p['topology_ptm'],\
    \ low_confidence_regions=merged)\n    return dict(structure=dict(source=source,\
    \ mean_plddt=mean, plddt_per_residue=scores,\n                               ptm=ptm,\
    \ **quality), quality=quality, parameters=p,\n                rule_basis='AgentA_SOP_v10.5_20260902\
    \ S-09; ToolSpec_\u7ED3\u6784\u9884\u6D4B\u83B7\u53D6\u94FE_v10.5 \xA72c/3',\n\
    \                calibration='E-06 defaults; not scientifically signed off',\n\
    \                scientific_gate='CLOSED', usable_for_pipeline=False, automatic_handoff=False)\n"
