  r04-t01-phase1-real-development-foldx-source-py: "\"\"\"Prepare a structure-bound\
    \ FoldX request and auditable mapping payload.\"\"\"\nfrom ...common import decode,\
    \ encode, ensure, sha\nfrom ..proteinmpnn.source import sources as structure_sources\n\
    from . import policy\n\n\ndef _foldx_token(row, mutation=None, scan=False):\n\
    \    if row.get(\"insertion_code\") not in (None, \"\", \" \"):\n        return\
    \ None\n    chain = row[\"chain_id\"]\n    # FoldX consumes the repaired canonical\
    \ PDB emitted by the projection; its\n    # auth_seq_id is therefore the reversible\
    \ tool_pdb_resseq (1-based).\n    resseq = row[\"tool_pdb_resseq\"]\n    wt =\
    \ row[\"residue\"]\n    if scan:\n        return wt + chain + str(resseq) + \"\
    a\"\n    # Position mapping rows record the address prefix before a concrete\n\
    \    # BuildModel mutation is selected; variant rows append the target AA.\n \
