apiVersion: v1
kind: ServiceAccount
metadata:
  name: t01-control-plane
  namespace: him-ws
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: t01-control-plane-config
  namespace: him-ws
data:
  release.yaml: 'completion_boundary: LOCAL_RELEASE_CANDIDATE_ONLY

    production_status: NOT_DEPLOYED

    scientific_gate: CLOSED

    gpu_count_estimate: 1

    gpu_memory_gib_estimate: 64

    project_cpu_estimate: 32

    project_memory_gib_estimate: 192

    '
  launcher.json: '{"ca_file":"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt","control_image":"contract-fixture/control@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","image_pull_secrets":["t01-registry-pull"],"namespace":"him-ws","runtime_claim":"t01-phase1-real-runtime","runtime_volume_root":"/var/lib/t01","server":"https://api.contract-fixture.local","token_file":"/var/run/secrets/kubernetes.io/serviceaccount/token","tools":{"structure":{"asset_claim":"t01-structure-assets","gpu_resource_key":null,"image":"contract-fixture/structure@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}}}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: t01-phase1-real-runtime
  namespace: him-ws
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Ti
  storageClassName: ceph-rbd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t01-control-plane
  namespace: him-ws
  labels: &id001
    app.kubernetes.io/name: t01-phase1-real
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      serviceAccountName: t01-control-plane
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: service
        image: contract-fixture/control@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        imagePullPolicy: IfNotPresent
        args:
        - --host
        - 0.0.0.0
        - --port
        - '18083'
        - --runtime-root
        - /var/lib/t01/runtime
        env:
        - name: T01_REAL_SERVICE_CREDENTIALS_FILE
          value: /run/secrets/t01/credentials.json
        - name: T01_KUBERNETES_CONFIG_FILE
          value: /etc/t01-launcher.json
        ports:
        - name: http
          containerPort: 18083
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          requests:
            cpu: '2'
            memory: 8Gi
          limits:
            cpu: '4'
            memory: 16Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: runtime
          mountPath: /var/lib/t01
        - name: credentials
          mountPath: /run/secrets/t01
          readOnly: true
        - name: config
          mountPath: /etc/t01
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/t01-launcher.json
          subPath: launcher.json
          readOnly: true
        - name: source-assets
          mountPath: /app/var/t01-phase1-real/tool-assets
          readOnly: true
      volumes:
      - name: runtime
        persistentVolumeClaim:
          claimName: t01-phase1-real-runtime
      - name: credentials
        secret:
          secretName: t01-service-credentials
          defaultMode: 256
      - name: config
        configMap:
          name: t01-control-plane-config
          defaultMode: 292
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: source-assets
        persistentVolumeClaim:
          claimName: t01-source-assets
      imagePullSecrets:
      - name: t01-registry-pull
---
apiVersion: v1
kind: Service
metadata:
  name: t01-control-plane
  namespace: him-ws
  labels: &id001
    app.kubernetes.io/name: t01-phase1-real
    app.kubernetes.io/component: control-plane
spec:
  type: ClusterIP
  selector: *id001
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: t01-scientific-offline
  namespace: him-ws
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: scientific-job
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
