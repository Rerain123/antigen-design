apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: t01-scientific-job-controller
  namespace: him-ws
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: t01-control-plane-jobs
  namespace: him-ws
subjects:
- kind: ServiceAccount
  name: t01-control-plane
  namespace: him-ws
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: t01-scientific-job-controller
