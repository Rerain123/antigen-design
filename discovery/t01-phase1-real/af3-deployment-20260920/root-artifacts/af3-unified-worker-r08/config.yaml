  development--af3--worker.py: "\"\"\"Resident AF3 command supervised by the shared\
    \ process cancellation layer.\"\"\"\nimport argparse\nimport os\nfrom pathlib\
    \ import Path\nimport socket\n\nfrom .primitives import decode, encode, ensure,\
    \ sha\nfrom . import policy\nfrom .native_worker import run\nfrom .standard import\
    \ normalize\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument('--input-dir',\
    \ type=Path, required=True)\n    parser.add_argument('--output-dir', type=Path,\
    \ required=True)\n    args = parser.parse_args()\n    body_raw = (args.input_dir\
    \ / 'input.json').read_bytes(); body = policy.request(body_raw)\n    binding =\
    \ decode((args.input_dir / 'binding.json').read_bytes())\n    ensure(binding['input_sha256']\
    \ == sha(body_raw) and binding['execution_profile'] == policy.registered_profile(),\n\
    \           'PROFILE_NOT_APPROVED', 'Bound AF3 input or implementation changed')\n\
    \    for family in (socket.AF_INET, socket.AF_INET6):\n        try:\n        \
    \    handle = socket.socket(family, socket.SOCK_STREAM)\n        except PermissionError:\n\
    \            continue\n        else:\n            handle.close(); raise RuntimeError('Resident\
    \ INET socket restriction is not active')\n    args.output_dir.mkdir(exist_ok=True)\n\
    \    request_path = args.output_dir / 'native-request.json'\n    request_path.write_bytes(encode(policy.native_request(body,binding)))\n\
    \    native_root = args.output_dir / 'raw'\n    run(request_path,native_root,policy.HERE/'profile.json')\n\
    \    native = {path.relative_to(native_root).as_posix():path.read_bytes()\n  \
    \            for path in sorted(native_root.rglob('*')) if path.is_file()}\n \
    \   for name,raw in normalize(native,body,binding).items():\n        path = args.output_dir\
    \ / name; path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(raw)\n\
    \    observation = decode((args.output_dir.parent/'executor-observation.json').read_bytes())\n\
    \    runtime = dict(input_sha256=sha(body_raw),binding=binding,\n        source_sha256={path.name:sha(path.read_bytes())\
    \ for path in sorted(policy.HERE.iterdir())\n                       if path.suffix\
    \ in ('.py','.json')},\n        network_interfaces=observation['network_interfaces'],cpu_affinity=observation['cpu_affinity'],\n\
    \        socket_probe='INET_INET6_DENIED',python_exit_code=0)\n    (args.output_dir/'runtime.json').write_bytes(encode(runtime))\n\
    \n\nif __name__ == '__main__':\n    main()\n"
  development--esmfold2--primitives.py: "\"\"\"Small worker JSON helpers; backend\
    \ uses the existing RuntimeFault class.\"\"\"\nimport hashlib\nimport json\nimport\
    \ math\n\ntry:\n    from ...common import RuntimeFault\nexcept ModuleNotFoundError\
    \ as exc:\n    if exc.name != 'jsonschema': raise\n    class RuntimeFault(Exception):\n\
    \        def __init__(self, code, message):\n            self.code = code\n  \
    \          super().__init__(message)\n\n\ndef ensure(value, code, message):\n\
    \    if not value: raise RuntimeFault(code, message)\n\n\ndef sha(raw): return\
    \ hashlib.sha256(raw).hexdigest()\n\n\ndef encode(value):\n    return json.dumps(value,\
    \ ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False).encode('utf-8')\n\
    \n\ndef decode(raw):\n    def pairs(items):\n        result = {}\n        for\
    \ key,value in items:\n            ensure(key not in result, 'INVALID_REQUEST',\
    \ 'Duplicate JSON key')\n            result[key]=value\n        return result\n\
    \    def invalid(value): raise RuntimeFault('INVALID_REQUEST','Nonfinite JSON\
    \ number')\n    def number(value):\n        result=float(value)\n        ensure(math.isfinite(result),'INVALID_REQUEST','Nonfinite\
    \ JSON number')\n        return result\n    try: return json.loads(raw,object_pairs_hook=pairs,parse_constant=invalid,parse_float=number)\n\
    \    except (ValueError,UnicodeError,TypeError) as exc:\n        raise RuntimeFault('INVALID_REQUEST','Malformed\
    \ JSON') from exc\n"
  development--esmfold2--quality.py: "\"\"\"SOP v10.5 S-09 for already verified normalized\
    \ ESMFold2 confidence.\"\"\"\nimport math\n\nDEFAULTS = dict(high_plddt=0.70,\
    \ medium_plddt=0.50, topology_ptm=0.50,\n                low_plddt=0.50, min_region_length=5,\
    \ merge_gap=3)\n\n\ndef assess(scores, ptm, parameters=None, source='esmfold2_predicted'):\n\
    \    p = dict(DEFAULTS if parameters is None else parameters)\n    if (set(p)\
    \ != set(DEFAULTS) or source not in ('esmfold2_predicted','af3_predicted')\n \
    \           or not scores or any(not math.isfinite(s) or not 0 <= s <= 1 for s\
    \ in scores)):\n        raise ValueError('Invalid verified confidence or S09 parameters')\n\
    \    mean = math.fsum(scores)/len(scores)\n    regions = []; start = None\n  \
    \  for pos, score in enumerate([*scores, 1.0], 1):\n        if score < p['low_plddt']\
    \ and start is None: start = pos\n        if score >= p['low_plddt'] and start\
    \ is not None:\n            if pos-start >= p['min_region_length']: regions.append(dict(start=start,\
    \ end=pos-1))\n            start = None\n    merged = []\n    for r in regions:\n\
    \        if merged and r['start']-merged[-1]['end']-1 <= p['merge_gap']: merged[-1]['end']\
    \ = r['end']\n        else: merged.append(dict(r))\n    quality = dict(confidence='high'\
    \ if mean >= p['high_plddt'] else 'medium' if mean >= p['medium_plddt'] else 'low',\n\
    \                   topology_reliable=ptm is not None and ptm >= p['topology_ptm'],\
    \ low_confidence_regions=merged)\n    return dict(structure=dict(source=source,\
    \ mean_plddt=mean, plddt_per_residue=scores,\n                               ptm=ptm,\
    \ **quality), quality=quality, parameters=p,\n                rule_basis='AgentA_SOP_v10.5_20260902\
    \ S-09; ToolSpec_\u7ED3\u6784\u9884\u6D4B\u83B7\u53D6\u94FE_v10.5 \xA72c/3',\n\
    \                calibration='E-06 defaults; not scientifically signed off',\n\
    \                scientific_gate='CLOSED', usable_for_pipeline=False, automatic_handoff=False)\n"
