    \n\ndef spec(tool_id):\n    if tool_id == af3.TOOL: return af3\n    if tool_id\
    \ == esmfold2.TOOL: return esmfold2\n    ensure(tool_id in TOOLS,'PROFILE_NOT_APPROVED','Development\
    \ Worker is not registered')\n    return {workflow.TOOL:workflow,deep.TOOL:deep,structure.TOOL:structure,bepipred.TOOL:bepipred,netmhc.TOOL:netmhc,blast.TOOL:blast,epitope_map.TOOL:epitope_map,\n\
    \        glycosylation.TOOL:glycosylation,homology.TOOL:homology,domains.TOOL:domains,developability.TOOL:developability,\n\
    \        wt_draft.TOOL:wt_draft,proteinmpnn.TOOL:proteinmpnn,esm_if1.TOOL:esm_if1,design_backend.TOOL:design_backend,variant_report.TOOL:variant_report,epitope_protection.TOOL:epitope_protection,codon.TOOL:codon,wt_reference.TOOL:wt_reference,local_delivery.TOOL:local_delivery,\n\
    \        thermompnn.TOOL:thermompnn,foldx.TOOL:foldx}[tool_id]\n\n\ndef result(job,body,files,execution,fault=None):\n\
    \    if job['tool_id']==af3.TOOL:\n        from .af3.result import result as build\n\
    \    elif job['tool_id']==esmfold2.TOOL:\n        from .esmfold2.result import\
    \ result as build\n    elif job['tool_id']==deep.TOOL:\n        from .deeptmhmm\
    \ import result as build\n    elif job['tool_id']==structure.TOOL:\n        from\
    \ .structure.result import result as build\n    elif job['tool_id']==bepipred.TOOL:\n\
    \        from .bepipred.result import result as build\n    elif job['tool_id']==netmhc.TOOL:\n\
    \        from .netmhc.result import result as build\n    elif job['tool_id']==blast.TOOL:\n\
    \        from .blast.result import result as build\n    elif job['tool_id']==epitope_map.TOOL:\n\
    \        from .epitope_map.result import result as build\n    elif job['tool_id']==domains.TOOL:\n\
    \        from .domains.service import result as build\n    elif job['tool_id']==homology.TOOL:\n\
    \        from .homology.result import result as build\n    elif job['tool_id']==developability.TOOL:\n\
    \        from .developability.service import result as build\n    elif job['tool_id']==wt_draft.TOOL:\n\
    \        from .wt_draft.service import result as build\n    elif job['tool_id']==proteinmpnn.TOOL:\n\
    \        from .proteinmpnn.result import result as build\n    elif job['tool_id']==wt_reference.TOOL:\n\
    \        from .wt_reference.service import result as build\n    elif job['tool_id']==local_delivery.TOOL:\n\
    \        from .local_delivery.service import result as build\n    elif job['tool_id']==codon.TOOL:\n\
    \        from .codon.service import result as build\n    elif job['tool_id']==epitope_protection.TOOL:\n\
    \        from .epitope_protection.service import result as build\n    elif job['tool_id']==variant_report.TOOL:\n\
    \        from .variant_report.service import result as build\n    elif job['tool_id']==design_backend.TOOL:\n\
    \        from .design_backend.service import result as build\n    elif job['tool_id']==esm_if1.TOOL:\n\
    \        from .esm_if1.result import result as build\n    elif job['tool_id']==thermompnn.TOOL:\n\
    \        from .thermompnn.result import result as build\n    elif job['tool_id']==foldx.TOOL:\n\
    \        from .foldx.result import result as build\n    else:\n        from .glycosylation.result\
    \ import result as build\n    return build(job,body,files,execution,fault)\n"
  af3-development--runtime.py: "\"\"\"Development Worker registry over the existing\
