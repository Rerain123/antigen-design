    \            # Same tables, transactions and transition rules; only the additive\n\
    \            # N04/tool schema differs from the preserved W1 store implementation.\n\
    \            validate(value,'job')\n            if before is not None:\n     \
    \           ensure(before['state'] not in TERMINAL,'INVALID_STATE','Terminal job\
    \ is immutable')\n                ensure(value['state']==before['state'] or value['state']\
    \ in TRANSITIONS[before['state']],'INVALID_STATE','Illegal lifecycle transition')\n\
    \                value['revision']=before['revision']+1;value['updated_at']=now()\n\
    \                db.execute('UPDATE jobs SET data=? WHERE id=?',(encode(value).decode(),value['job_id']))\n\
    \            else:db.execute('INSERT INTO jobs VALUES(?,?,?,?)',(value['job_id'],value['run_id'],self.scope,encode(value).decode()))\n\
    \            db.execute('INSERT INTO events VALUES(?,?,?)',(value['job_id'],value['revision'],encode(dict(event=event,snapshot=value)).decode()))\n\
