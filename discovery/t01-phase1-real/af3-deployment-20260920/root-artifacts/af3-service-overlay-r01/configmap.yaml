    \    def submit(self,raw):\n        ensure(isinstance(raw,bytes) and len(raw)<=65536,'INVALID_REQUEST','Bounded\
    \ UTF-8 bytes required')\n        body=decode(raw)\n        if not isinstance(body,dict)\
    \ or body.get('tool_id') not in (af3.TOOL,esmfold2.TOOL,blast.TOOL,bepipred.TOOL,netmhc.TOOL,epitope_map.TOOL,\n\
    \            glycosylation.TOOL,homology.TOOL,domains.TOOL,developability.TOOL,wt_draft.TOOL,proteinmpnn.TOOL,esm_if1.TOOL,design_backend.TOOL,variant_report.TOOL,epitope_protection.TOOL,wt_reference.TOOL,local_delivery.TOOL,workflow.TOOL,codon.TOOL,\n\
