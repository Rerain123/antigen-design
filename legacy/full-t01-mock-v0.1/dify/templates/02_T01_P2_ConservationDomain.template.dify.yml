app:
  description: T-01 v10 阶段2调试流程；上下文入口只补跑S-16，完整入口执行S-13至S-16。
  icon: 🧭
  icon_background: '#E8F5E9'
  mode: workflow
  name: T01_P2_ConservationDomain
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: if-else
      id: edge_P2_START_source_P2_IF_CONTEXT
      source: P2_START
      sourceHandle: source
      target: P2_IF_CONTEXT
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: if-else
        targetType: tool
      id: edge_P2_IF_CONTEXT_false_P2_S13_HOMOLOGS
      source: P2_IF_CONTEXT
      sourceHandle: 'false'
      target: P2_S13_HOMOLOGS
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: tool
        targetType: tool
      id: edge_P2_S13_HOMOLOGS_source_P2_S14_CONSERVATION
      source: P2_S13_HOMOLOGS
      sourceHandle: source
      target: P2_S14_CONSERVATION
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: tool
        targetType: tool
      id: edge_P2_S14_CONSERVATION_source_P2_S15_REGIONS
      source: P2_S14_CONSERVATION
      sourceHandle: source
      target: P2_S15_REGIONS
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: tool
        targetType: tool
      id: edge_P2_S15_REGIONS_source_P2_R11_TYPING
      source: P2_S15_REGIONS
      sourceHandle: source
      target: P2_R11_TYPING
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: tool
        targetType: tool
      id: edge_P2_R11_TYPING_source_P2_S16_DOMAINS_FULL
      source: P2_R11_TYPING
      sourceHandle: source
      target: P2_S16_DOMAINS_FULL
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: if-else
        targetType: tool
      id: edge_P2_IF_CONTEXT_true_P2_S16_DOMAINS_CONTEXT
      source: P2_IF_CONTEXT
      sourceHandle: 'true'
      target: P2_S16_DOMAINS_CONTEXT
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: tool
        targetType: variable-aggregator
      id: edge_P2_S16_DOMAINS_FULL_source_P2_RESULT_JOIN
      source: P2_S16_DOMAINS_FULL
      sourceHandle: source
      target: P2_RESULT_JOIN
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: tool
        targetType: variable-aggregator
      id: edge_P2_S16_DOMAINS_CONTEXT_source_P2_RESULT_JOIN
      source: P2_S16_DOMAINS_CONTEXT
      sourceHandle: source
      target: P2_RESULT_JOIN
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: variable-aggregator
        targetType: end
      id: edge_P2_RESULT_JOIN_source_P2_END
      source: P2_RESULT_JOIN
      sourceHandle: source
      target: P2_END
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - variable: run_id
          label: 运行 ID
          type: text-input
          required: true
          max_length: 128
          options: []
        - variable: execution_mode
          label: 执行模式
          type: select
          required: true
          max_length: 128
          options:
          - mock
        - variable: entry_mode
          label: 入口模式
          type: select
          required: true
          max_length: 128
          options:
          - full
          - context_only
      height: 196
      id: P2_START
      position:
        x: 0
        y: 220
      positionAbsolute:
        x: 0
        y: 220
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 270
    - data:
        desc: ''
        selected: false
        title: 仅补跑 S-16?
        type: if-else
        _targetBranches:
        - id: 'true'
          name: IF
        - id: 'false'
          name: ELSE
        logical_operator: and
        cases:
        - case_id: 'true'
          logical_operator: and
          conditions:
          - id: P2_IF_CONTEXT_condition
            variable_selector:
            - P2_START
            - entry_mode
            comparison_operator: is
            value: context_only
            varType: string
      height: 150
      id: P2_IF_CONTEXT
      position:
        x: 320
        y: 240
      positionAbsolute:
        x: 320
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 270
    - data:
        desc: conservation.collect_homologs · Collect homologs and confidence (mock only).
