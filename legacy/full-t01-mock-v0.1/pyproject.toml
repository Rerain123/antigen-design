[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "t01-mock-mcp"
version = "0.1.0"
description = "Contract-first Mock MCP server for the T-01 protein refinement workflow"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mcp==2.0.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
  "PyYAML==6.0.3",
  "pytest==8.4.2",
]

[project.scripts]
t01-mock-mcp = "t01_mock_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
